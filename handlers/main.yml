---
- name: restart redis
  ansible.builtin.service: "name={{ redis_daemon }} state=restarted"

- name: restart sentinel
  ansible.builtin.service: "name=sentinel state=restarted"

- name: restart redis container
  community.docker.docker_container:
    name: "{{ redis_container_name }}"
    state: started
    restart: yes
  when: not redis_swarm

- name: restart sentinel container
  community.docker.docker_container:
    name: "{{ redis_sentinel_container_name }}"
    state: started
    restart: yes
  when: not redis_sentinel_swarm
