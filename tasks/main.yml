---
- name: Include OS-specific variables.
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] | replace (' ', '') }}.yml"

- ansible.builtin.include_tasks: redis-install.yml
  when: redis_standalone or redis_sentinel_standalone

- ansible.builtin.include_tasks: redis-container.yml
  when: redis_docker

- ansible.builtin.include_tasks: sentinel.yml
  when: redis_sentinel_standalone

- ansible.builtin.include_tasks: sentinel-container.yml
  when: redis_sentinel_docker
